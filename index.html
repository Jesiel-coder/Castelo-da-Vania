<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Castelo da Vania</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas></canvas>

    <!-- Botão de Tela Cheia -->
    <button id="btn-fullscreen" title="Tela Cheia">⛶</button>

    <div id="controles">
        <div class="grupo">
            <button data-tecla="a">◀</button>
            <button data-tecla="d">▶</button>
        </div>
        <div class="grupo">
            <button data-tecla="e" title="Interagir">E</button>
            <button data-tecla="s">▼</button>
            <button data-tecla="r" title="Recarregar">⟳</button>
            <button data-tecla="l">●</button>
            <button data-tecla="w">▲</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
