<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Castelo da Vania</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas></canvas>

    <!-- Botão de Tela Cheia -->
    <button id="btn-fullscreen" title="Tela Cheia">⛶</button>

    <div id="controles">
        <!-- D-Pad em formato de Cruz (Direcionais) -->
        <div class="dpad">
            <button data-tecla="w" class="dpad-up">▲</button>
            <button data-tecla="a" class="dpad-left">◀</button>
            <button data-tecla="s" class="dpad-down">▼</button>
            <button data-tecla="d" class="dpad-right">▶</button>
        </div>

        <!-- Grupo de Ações (Linha) -->
        <div class="grupo-acoes">
            <button data-tecla="e" title="Interagir">E</button>
            <button data-tecla="r" title="Recarregar">⟳</button>
            <button data-tecla="l">●</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
